[package]
name = "sqlx-pool-router"
version = "1.0.0"
edition = "2021"
authors = ["fergus.finn@doubleword.ai"]
description = "Lightweight SQLx PostgreSQL connection pool routing for primary/replica separation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/doublewordai/sqlx-pool-router"
keywords = ["database", "postgres", "pool", "replica", "routing"]
categories = ["database", "asynchronous"]
readme = "README.md"

[dependencies]
arc-swap = "1"
async-stream = "0.3"
either = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc", "async-await-macro"] }
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio"] }
tinyvec = "=1.12.0" # 锁定：1.13.0 在 nightly 下 vec! 宏导入失败

[dev-dependencies]
tokio = { version = "1.0", features = ["full"] }
url = "2.5"
sqlx = { version = "0.9", features = ["postgres", "macros", "runtime-tokio"] }

[features]
default = []
# sqlx 0.9 的 Executor::describe 是 sqlx-core/offline 条件方法；offline 经 sqlx/macros 间接启用。
# 测试（#[sqlx::test] 需 macros）时启用本 feature 以同步实现 describe。
offline = ["sqlx/macros"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
